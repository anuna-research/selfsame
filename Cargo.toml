[workspace]
resolver = "2"
members = [
    "crates/selfsame-core",
    "crates/selfsame-app-identity",
    "crates/selfsame-app-identity-net",
    "crates/selfsame-rendezvous",
    "crates/selfsame-cli",
    "crates/selfsame-web-device",
    "crates/selfsame-beam",
    "crates/tauri-plugin-selfsame-store",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# SPEC-002 ADR-106: `bc-lifehash` is edition 2024, which needs 1.85. CI installs
# stable so nothing breaks in practice — which is exactly why the declared MSRV
# has to move with it rather than stay a number the graph cannot honour.
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://git.anuna.io/anuna-research/selfsame"

[workspace.dependencies]
selfsame-core = { path = "crates/selfsame-core", default-features = false }
selfsame-app-identity = { path = "crates/selfsame-app-identity" }

# ── pinned upstream dependencies (SPEC-001 ADR-010, ADR-013) ─────────────────
#
# Both are sibling checkouts. Clone them alongside this repository:
#
#   git clone https://git.anuna.io/anuna-research/did-crdt ../did-crdt
#   git clone https://git.anuna.io/anuna-research/cbcl-rs  ../cbcl-rs
#
# `cbcl-rs.sha` at the repository root pins the second of these; the first is
# pinned by the revision recorded in crates/selfsame-core/tests/vectors.rs.
# .forgejo/workflows/ci.yml clones both from those pins.
#
# did-crdt is pinned at fbccfd5885cd0c0136218f809ea0e183bc7e49f3 by SPEC-001
# ADR-010: its DID derivation and `u`-multibase encoding are adopted verbatim,
# and any change to either is a breaking change to the specification.
# `crates/selfsame-core/tests/pinned_derivation.rs` fails if the derivation
# drifts, so the pin is enforced by a test rather than by a comment.
did-crdt = { path = "../did-crdt", default-features = false }

# cbcl-rs supplies the wire encoding and the canonical signing form (ADR-013).
cbcl-core = { path = "../cbcl-rs/crates/cbcl-core", default-features = false }
cbcl-parser = { path = "../cbcl-rs/crates/cbcl-parser", default-features = false }

# ── shared third-party ──────────────────────────────────────────────────────
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
base64ct = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

# LifeHash v2 — the visual fingerprint of SPEC-002 (ADR-101). Blockchain
# Commons' first-party Rust implementation, byte-identical to the C++ reference
# across all 35 of its test vectors; `tests/lifehash_vectors.rs` re-checks that
# here so a bump cannot silently change every user's picture.
#
# Pinned exactly. A LifeHash that changes under the user is worse than no
# LifeHash: it teaches them that the picture changing is normal, which is the
# one thing it must never mean.
bc-lifehash = "=0.1.0"

# `bc-lifehash` runs Conway's Game of Life for up to 150 generations per image,
# which is ~570 µs optimised and ~6.6 ms not. TEST-106 renders 10^5 of them, so
# unoptimised it would take eleven minutes instead of seven seconds. The
# override buys that back without touching the profile of anything we wrote.
[profile.dev.package.bc-lifehash]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
