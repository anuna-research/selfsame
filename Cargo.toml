[workspace]
resolver = "2"
members = [
    "crates/selfsame-core",
    "crates/selfsame-rendezvous",
    "crates/selfsame-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0"
repository = "https://codeberg.org/anuna/selfsame"

[workspace.dependencies]
selfsame-core = { path = "crates/selfsame-core", default-features = false }

# ── pinned upstream dependencies (SPEC-001 ADR-010, ADR-013) ─────────────────
#
# Both are sibling checkouts. Clone them alongside this repository:
#
#   git clone https://github.com/anuna-research/did-crdt ../did-crdt
#   git clone https://codeberg.org/anuna/cbcl-rs        ../cbcl-rs
#
# did-crdt is pinned at adb5c7ac1423173f00201cddffa60fe672fb2a53 by SPEC-001
# ADR-010: its DID derivation and `u`-multibase encoding are adopted verbatim,
# and any change to either is a breaking change to the specification.
# `crates/selfsame-core/tests/pinned_derivation.rs` fails if the derivation
# drifts, so the pin is enforced by a test rather than by a comment.
did-crdt = { path = "../did-crdt", default-features = false }

# cbcl-rs supplies the wire encoding and the canonical signing form (ADR-013).
cbcl-core = { path = "../cbcl-rs/crates/cbcl-core", default-features = false }
cbcl-parser = { path = "../cbcl-rs/crates/cbcl-parser", default-features = false }

# ── shared third-party ──────────────────────────────────────────────────────
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
base64ct = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
