name: selfsame-android

# Builds a sideloadable APK on every push to main and publishes it to the
# `anuna-files` Cloudflare R2 bucket under `selfsame/`. Implements SPEC-003.
#
# ── This job needs two things this repository cannot provide ────────────────
#
#   1. RUNNER MEMORY. A Tauri Android build runs `cargo build` inside a Gradle
#      task, so rustc and a JVM are resident at once. Five spike runs measured
#      the ceiling: the job container is capped at 3.00 GiB while the host has
#      16 GB, and the build does not fit — not even with CARGO_BUILD_JOBS=1 and
#      a 1 GB Gradle heap, which merely made it fail after 55 minutes instead of
#      25. Needs ~8 GiB: `container.options: "--memory=8g"` in act_runner.
#
#   2. R2 CREDENTIALS as repository secrets. The preflight step below names them
#      and fails immediately if any are absent, because the alternative is a
#      25-minute build followed by an opaque `aws` error.
#
# Deliberately separate from ci.yml. That workflow reports in ~5 minutes and
# gates merges; this one takes ~25 and gates nothing (SPEC-003 NFR-201). A slow
# Android build must never be the reason a CSS fix waits.

on:
  push:
    branches: [main]
  workflow_dispatch:

# THE `pull_request:` TRIGGER IS GONE, and it was labelled "TEMPORARY — remove
# before merging" when it was added. It outlived that instruction and started
# doing what NFR-201 forbids: a ~25-minute Android build reporting red on pull
# requests that ci.yml had already passed in five.
#
# It earned its keep — it is how this workflow was verified on a branch rather
# than merged untested onto main — and it has run on main since, so there is
# nothing left for it to prove. `workflow_dispatch` covers the case it was
# actually for: verifying a change to THIS file before it lands.
#
# What made it worth removing now rather than later: PR #40 went red on an
# `aws s3 cp` read timeout mid-multipart, on a build that had already succeeded.
# A job that gates nothing by spec should not be able to fail a review, and an
# R2 flake is exactly the failure it will keep contributing.

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_NDK_VERSION: 27.2.12479018
      CMDLINE_TOOLS_ZIP: commandlinetools-linux-11076708_latest.zip
      # BUCKET and PROJECT are exported in the upload step rather than declared
      # here, matching hark's release workflow — one place they are set, and it
      # is the place they are used.
      #
      # SPEC-003 OBS-203. The APK was 208 MB and 199 MB of that was one file,
      # `lib/arm64-v8a/libselfsame_lib.so`, of which 90% was debug information:
      # 161.8 MB across `.debug_*` and 17.5 MB more in `.symtab`/`.strtab`,
      # against 13 MB of actual `.text`. `--debug` is load-bearing for the
      # signing config (ADR-201), so the dev profile stays — only the DWARF
      # goes, which costs no build time and changes no behaviour.
      #
      # `debuginfo` rather than `symbols`, matching the workspace's own
      # `[profile.release]`: the symbol table is 17.5 MB and it is what makes a
      # native backtrace name functions, which is worth more on a sideloaded
      # development build than the 17.5 MB is.
      #
      # Set here rather than in `[profile.dev]` because this is a property of
      # the published artefact, not of the profile — a maintainer's local
      # `cargo build` keeps its symbols and stays debuggable.
      CARGO_PROFILE_DEV_STRIP: debuginfo

    steps:
      # Fail in seconds, not after a 25-minute build, and say exactly which
      # name is missing. Secret *values* are never echoed — only presence.
      # Secret names match hark's release pipeline, which already publishes to
      # this bucket. Same credentials, same convention — a second set of names
      # for the same R2 token would be a trap for whoever rotates it.
      - name: Preflight — are the R2 secrets present?
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "${CF_ACCOUNT_ID:-}" ]           || missing="$missing CF_ACCOUNT_ID"
          [ -n "${CF_R2_ACCESS_KEY_ID:-}" ]     || missing="$missing CF_R2_ACCESS_KEY_ID"
          [ -n "${CF_R2_SECRET_ACCESS_KEY:-}" ] || missing="$missing CF_R2_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "" >&2
            echo "These are the same three hark's release workflow uses to publish" >&2
            echo "to this bucket. Add them under Settings -> Actions -> Secrets," >&2
            echo "or at the organisation level so both repositories inherit one" >&2
            echo "copy of the credential." >&2
            # Reported into a commit status too: this instance serves no job
            # logs, so a bare "Failing after 4s" is all anyone would otherwise
            # see — which is how the first attempt at this wasted a round-trip.
            # /tmp/job.err is the general channel for "the reason, in words" —
            # the size guard below writes to it as well.
            echo "PREFLIGHT missing:$missing" > /tmp/job.err
            exit 1
          fi
          echo "all three R2 secrets present"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone the pinned siblings
        run: |
          set -euo pipefail
          # Read out of vectors.rs, exactly as ci.yml does and for the same
          # reason it gives: that file records the revision the test vectors
          # were generated against, so it is the source of truth, and a copy
          # here is a second place for it to be wrong.
          #
          # It was a copy, and it went wrong: this job kept building against
          # the previous pin after ci.yml had moved on, so `rust` passed and
          # `android` failed to compile selfsame-core — a failure that reads
          # like a target problem and is actually a stale sibling.
          did_sha="$(tr -d '[:space:]' < did-crdt.sha)"
          cbcl_sha="$(tr -d '[:space:]' < cbcl-rs.sha)"
          pairing_sha="$(tr -d '[:space:]' < cbcl-pairing.sha)"
          echo "did-crdt @ ${did_sha}"
          echo "cbcl-rs  @ ${cbcl_sha}"
          echo "cbcl-pairing @ ${pairing_sha}"
          [ -d ../did-crdt ] || git clone https://git.anuna.io/anuna-research/did-crdt.git ../did-crdt
          # Always fetch: a warm workspace keeps the clone from a previous run,
          # so a pin newer than that clone resolves to "reference is not a tree"
          # and the failure reads as a bad pin rather than a stale checkout.
          git -C ../did-crdt fetch --quiet --tags origin
          git -C ../did-crdt checkout --detach "${did_sha}"
          test "$(git -C ../did-crdt rev-parse HEAD)" = "${did_sha}"
          [ -d ../cbcl-rs ] || git clone https://git.anuna.io/anuna-research/cbcl-rs.git ../cbcl-rs
          # Always fetch: a warm workspace keeps the clone from a previous run,
          # so a pin newer than that clone resolves to "reference is not a tree"
          # and the failure reads as a bad pin rather than a stale checkout.
          git -C ../cbcl-rs fetch --quiet --tags origin
          git -C ../cbcl-rs checkout --detach "${cbcl_sha}"
          test "$(git -C ../cbcl-rs rev-parse HEAD)" = "${cbcl_sha}"
          [ -d ../cbcl-pairing ] || git clone https://git.anuna.io/anuna-research/cbcl-pairing.git ../cbcl-pairing
          git -C ../cbcl-pairing fetch --quiet --tags origin
          git -C ../cbcl-pairing checkout --detach "${pairing_sha}"
          test "$(git -C ../cbcl-pairing rev-parse HEAD)" = "${pairing_sha}"
          test -z "$(git -C ../cbcl-pairing status --porcelain --untracked-files=no)"

      - name: Install the C toolchain and JDK 17
        run: |
          set -euo pipefail
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "This job needs apt-get to install a JDK and the C toolchain." >&2
            exit 1
          fi
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO apt-get update
          # JDK 17, not "whatever is newest". Gradle's Android plugin rejects
          # newer JDKs, and the runner has no Android Studio to borrow a JBR
          # from — which is what Tauri's own prerequisites tell a human to point
          # JAVA_HOME at. Their desktop instructions stop applying here.
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file unzip openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      # ~20 of the ~25 minutes a cold run costs is this download. Keyed on the
      # pinned versions, so a bump busts it deliberately and nothing else does.
      - name: Cache the Android SDK and NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Install the Android SDK and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO mkdir -p "$ANDROID_HOME/cmdline-tools"
          $SUDO chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" >/dev/null

      - name: Point at the toolchain
        run: |
          set -euo pipefail
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            || { echo "NDK missing at the pinned version — cache may be stale" >&2; exit 1; }

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: android-cargo-${{ hashFiles('Cargo.lock', 'cbcl-rs.sha', 'did-crdt.sha', 'cbcl-pairing.sha') }}
          restore-keys: android-cargo-

      - name: Ensure Rust and the aarch64 Android target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # arm64 only (SPEC-003 ADR-202). Four ABIs quadruple the build for a
          # sideloaded dev artefact and every device worth testing on is arm64.
          rustup target add aarch64-linux-android
          command -v cargo-tauri >/dev/null 2>&1 \
            || cargo install tauri-cli --version '^2' --locked
          cargo tauri --version

      # gen/android is generated, not committed (ADR-204). ADR-203 recovers the
      # reviewability that costs us: the permissions are guarded below.
      - name: Generate the Android project
        run: CI=1 cargo tauri android init --ci

      - name: Bound Gradle and cargo to the container
        run: |
          set -euo pipefail
          props=src-tauri/gen/android/gradle.properties
          [ -f "$props" ] || : > "$props"
          # Written with echo, not a heredoc: a heredoc body must start at
          # column 0, which escapes this YAML block scalar.
          {
            echo ""
            echo "# Set by selfsame-android — see SPEC-003 OBS-201."
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.caching=false"
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
          } >> "$props"
          # rustc is the dominant memory term, not Gradle: cargo defaults to one
          # process per core and the runner has eight. Four is a compromise
          # between the 55-minute serial build and the OOM.
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          set -uo pipefail
          # --debug is load-bearing (ADR-201): the default is release, which
          # demands a signing config we deliberately do not create.
          cargo tauri android build --apk --debug -t aarch64 > /tmp/build.log 2>&1
          rc=$?
          tail -60 /tmp/build.log
          exit $rc

      # REQ-203. Reads the MERGED manifest — the post-init one declares only
      # INTERNET, so checking it would pass on every run and see nothing.
      - name: Check the shipped permissions against the allowlist
        run: |
          set -euo pipefail
          merged=$(find src-tauri/gen -path '*merged_manifest*' -name 'AndroidManifest.xml' | head -1)
          [ -n "$merged" ] || { echo "no merged manifest to check" >&2; exit 1; }
          echo "checking $merged"

          allow=$(grep -vE '^\s*(#|$)' src-tauri/android-permissions.allow | sort -u)
          have=$(grep -o 'android.permission.[A-Z_]*' "$merged" \
                 | sed 's/android.permission.//' | sort -u)
          extra=$(comm -13 <(echo "$allow") <(echo "$have") || true)

          if [ -n "$extra" ]; then
            echo "" >&2
            echo "The merged manifest declares permissions that are not on the" >&2
            echo "allowlist:" >&2
            echo "$extra" | sed 's/^/    /' >&2
            echo "" >&2
            echo "A dependency has widened what this app asks the OS for. Read" >&2
            echo "src-tauri/android-permissions.allow, decide whether the new" >&2
            echo "permission is wanted, and add it there with a reason — or" >&2
            echo "remove the dependency that brought it." >&2
            exit 1
          fi
          echo "shipped permissions are all accounted for:"
          echo "$have" | sed 's/^/    /'

      - name: Name the artefact
        id: apk
        run: |
          set -euo pipefail
          built=$(find src-tauri/gen -name '*.apk' | head -1)
          [ -n "$built" ] || { echo "the build reported success but produced no APK" >&2; exit 1; }
          # The filename carries the warning the signature does not (ADR-201):
          # this is debug-signed and cannot be upgraded in place by a release
          # build. Nobody should mistake it for shippable.
          name="selfsame-UNSIGNED-DEV-$(git rev-parse --short HEAD).apk"
          cp "$built" "/tmp/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          bytes=$(wc -c < "/tmp/$name")
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "$name is $((bytes / 1048576)) MiB ($bytes bytes)"

      # Follows hark's release pipeline, which already publishes to this bucket:
      # the **flat** prefix is "latest" — not a `latest/` subdirectory, which is
      # what I had first written — plus an immutable per-version copy beneath it.
      # hark keys that by tag; this job has no tags, so it keys by commit.
      # R2 IS NOT S3, AND THE DEFAULTS ASSUME IT IS.
      #
      # This step failed on a real run with `Read timeout on endpoint URL: ...
      # &partNumber=6` — a multipart PUT that got most of the way and then
      # stalled, after a 25-minute build had already succeeded. The `aws` CLI's
      # stock behaviour is tuned for S3: an 8 MB multipart threshold, 8 MB parts,
      # ten concurrent requests. Against R2 that turns one ~50 MB artefact into
      # dozens of concurrent small PUTs, and every one of them is a chance to
      # time out and fail the whole job.
      #
      # Three settings, each aimed at a different part of that:
      #
      #   - a multipart THRESHOLD above any plausible APK, so the normal case is
      #     one plain PUT and the multipart machinery never runs. R2 accepts a
      #     single PUT far above this; the threshold is what decides.
      #   - if it does run — a bigger artefact one day — 64 MB parts at a
      #     concurrency of 2, so there are few parts and they are not competing.
      #   - explicit timeouts and retries, because the failure observed was a
      #     stall rather than a refusal, and the default read timeout is 60s with
      #     no retry budget for it.
      #
      # The `retry` wrapper on top is deliberate belt-and-braces: botocore's
      # retries cover the request, not the command, and a part that dies late
      # leaves an incomplete multipart upload that a fresh `cp` simply replaces.
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          APK: ${{ steps.apk.outputs.name }}
          # botocore honours both; they are env rather than CLI flags because
          # `aws s3 cp` has no equivalent options.
          AWS_MAX_ATTEMPTS: "5"
          AWS_RETRY_MODE: standard
          # aws-cli v2.23+ sends a checksum R2 rejects on some paths. Harmless on
          # v1 (ignored), load-bearing if the runner image ever ships v2 — which
          # it may, since the install below only runs when `aws` is absent.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO apt-get update && $SUDO apt-get install -y awscli
          fi
          # Printed because the retry/checksum knobs above behave differently on
          # v1 and v2, and a log that does not say which was used cannot explain
          # a future failure.
          aws --version

          export AWS_DEFAULT_REGION=auto
          export R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export BUCKET="anuna-files"
          export PROJECT="selfsame"
          sha=$(git rev-parse --short HEAD)

          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 2

          # One place, so the two uploads cannot drift in their timeouts.
          upload() {
            aws s3 cp "$1" "$2" \
              --endpoint-url "$R2_ENDPOINT" \
              --cli-connect-timeout 30 \
              --cli-read-timeout 300
          }

          # Three attempts with a widening pause. The observed failure was a
          # transient stall, so the second attempt is worth far more than a
          # louder error message on the first.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "upload failed after $attempt attempts" >&2
                return 1
              fi
              echo "attempt $attempt failed; retrying in $((attempt * 15))s" >&2
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          # Flat prefix = latest. A stable filename so a download link does not
          # have to change every commit, which is the whole point of hark's flat
          # convention.
          retry upload "/tmp/${APK}" "s3://${BUCKET}/${PROJECT}/selfsame-UNSIGNED-DEV.apk"
          # Immutable per-commit archive — REQ-202.
          retry upload "/tmp/${APK}" "s3://${BUCKET}/${PROJECT}/${sha}/${APK}"
          echo "Uploaded: ${APK}"

          # Informational and non-fatal: an "Object Read & Write" R2 token can
          # PutObject but may lack ListBucket. hark's pipeline learned this.
          aws s3 ls "s3://${BUCKET}/${PROJECT}/" --endpoint-url "$R2_ENDPOINT" \
            || echo "(list not permitted by this token; the uploads above succeeded)"

          echo ""
          echo "Available at:"
          echo "  https://files.anuna.io/${PROJECT}/selfsame-UNSIGNED-DEV.apk"
          echo "  https://files.anuna.io/${PROJECT}/${sha}/${APK}"

      # SPEC-003 OBS-203. CARGO_PROFILE_DEV_STRIP is an environment variable
      # read by a cargo that Gradle invokes on our behalf, three processes
      # down. If a Tauri CLI bump ever builds under a different profile name,
      # the variable stops applying and nothing says so — the APK just returns
      # to 208 MB. This is the thing that says so.
      #
      # The ceiling is not a growth budget. Stripped, the APK is ~47 MB;
      # unstripped it was 208 MB. Nothing between those is reachable by
      # ordinary growth, so 100 MiB can only mean the debug information came
      # back, and the check has no opinion about anything else.
      #
      # It runs *after* the upload, unlike the permission allowlist, which
      # runs before. An over-permissioned APK is worse than no APK; a large
      # one is merely large. Failing first would cost the artefact as well as
      # the run, so the upload happens, and then the job goes red.
      - name: Guard the APK against the debug information coming back
        env:
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
        run: |
          set -euo pipefail
          ceiling=$((100 * 1024 * 1024))
          echo "APK is $((APK_BYTES / 1048576)) MiB, ceiling $((ceiling / 1048576)) MiB"
          if [ "$APK_BYTES" -gt "$ceiling" ]; then
            msg="APK is $((APK_BYTES / 1048576)) MiB, over the $((ceiling / 1048576)) MiB ceiling — CARGO_PROFILE_DEV_STRIP is no longer taking effect (SPEC-003 OBS-203). The APK was uploaded anyway."
            echo "$msg" > /tmp/job.err
            echo "$msg" >&2
            exit 1
          fi

      # This Forgejo serves no job logs, so a failure is otherwise visible only
      # as "Failing after Nm". Same workaround ci.yml uses.
      - name: Report the first error into a commit status
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          # The written reason first: a missing secret or a blown size ceiling
          # is a failure a bare "Failing after 4s" explains least.
          line=$(cat /tmp/job.err 2>/dev/null \
                 || grep -A 4 '^\* What went wrong:' /tmp/build.log 2>/dev/null | tail -n +2 \
                 || tail -n 3 /tmp/build.log 2>/dev/null \
                 || echo "failed before the build step")
          line=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-240)
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(printf '{"context":"android-diagnostic","state":"failure","description":%s}' \
                  "$(printf '%s' "$line" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
            >/dev/null || true
