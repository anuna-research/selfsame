name: selfsame-ci

# The four checks README.md tells a contributor to run, made non-optional.
#
#   cargo test --workspace
#   cargo clippy --workspace --all-targets
#   cargo build -p selfsame-core --target wasm32-unknown-unknown
#   npm run screens
#
# Three of those are load-bearing beyond "the code compiles", and it is worth
# saying which, because a green tick here is the only thing standing between a
# refactor and a silently different identity:
#
#   - `tests/purity.rs` fails if `tokio`, `reqwest`, `hyper`, `axum`, or a TLS
#     stack enters `selfsame-core`'s dependency graph, or if any core module
#     reaches for a clock, a socket, or a disk. The wasm build is the same
#     boundary checked from the other side — the core is compiled for a target
#     that simply has none of those things.
#   - `tests/pinned_derivation.rs` and `tests/vectors.rs` fail if `did-crdt`'s
#     DID derivation drifts. ADR-010 adopts that derivation verbatim, so a drift
#     is a breaking change to the protocol and re-derives every existing
#     identity. This is why the sibling checkouts below are pinned rather than
#     tracking a branch.
#   - `tests/screens.mjs` asserts what Rust cannot see: one screen visible at a
#     time, no horizontal overflow at phone width, no console errors, and — after
#     a bug that shipped a black rectangle — that a *missing* Tauri bridge
#     renders an explanation rather than nothing.
#
# The two jobs are deliberately independent. `screens` drives the webview with a
# stubbed bridge and needs no Rust at all, so a CSS regression is reported in
# under a minute instead of waiting on a Tauri build.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Rust: the core, the shells, and both boundary gates ─────────────────
  rust:
    runs-on: ubuntu-latest
    steps:
      # The workspace has path dependencies on two siblings, so this repo is
      # checked out into a subdirectory and they are cloned next to it —
      # reproducing the layout README.md's "Before you build" section describes.
      #
      #   Code/
      #   ├── selfsame/     ← here
      #   ├── did-crdt/
      #   └── cbcl-rs/
      - name: Check out selfsame
        uses: actions/checkout@v4
        with:
          path: selfsame

      # The pinned revision is read out of `vectors.rs` rather than written here
      # a second time. That file is the artefact the test vectors were generated
      # against, so it is the source of truth; duplicating the SHA into this
      # workflow would create a second place for it to be wrong.
      - name: Clone did-crdt at the revision the vectors were generated against
        run: |
          set -euo pipefail
          sha="$(grep -oE '[0-9a-f]{40}' selfsame/crates/selfsame-core/tests/vectors.rs | head -1)"
          echo "did-crdt pinned at ${sha}"
          git clone --filter=blob:none https://git.anuna.io/anuna-research/did-crdt.git did-crdt
          git -C did-crdt checkout --quiet "${sha}"
          test "$(git -C did-crdt rev-parse HEAD)" = "${sha}"

      - name: Clone cbcl-rs at the pinned revision
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < selfsame/cbcl-rs.sha)"
          echo "cbcl-rs pinned at ${sha}"
          git clone --filter=blob:none https://git.anuna.io/anuna-research/cbcl-rs.git cbcl-rs
          git -C cbcl-rs checkout --quiet "${sha}"
          test "$(git -C cbcl-rs rev-parse HEAD)" = "${sha}"

      # Installed with rustup rather than a marketplace action so this workflow
      # depends on nothing that has to be mirrored onto the runner.
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        working-directory: selfsame
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: cargo clippy
        working-directory: selfsame
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Covers purity.rs, pinned_derivation.rs, vectors.rs, properties.rs, and
      # hostile_rendezvous.rs, plus the rendezvous end-to-end suite which stands
      # up the real server on a loopback port.
      - name: cargo test
        working-directory: selfsame
        run: cargo test --workspace

      # The purity boundary, checked from the other side: a target with no
      # clock, no socket, and no disk simply will not link a core that reached
      # for one.
      - name: Build the core for wasm32
        working-directory: selfsame
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p selfsame-core --target wasm32-unknown-unknown

  # ── Screens: what Rust cannot see ───────────────────────────────────────
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Puppeteer ships its own Chrome but not the shared libraries it links
      # against; on a bare runner the browser launches and immediately dies
      # without them.
      # Ubuntu 24.04 renamed several of these with a `t64` suffix (the 64-bit
      # `time_t` transition) and 22.04 did not, so each name is resolved against
      # the runner's own package index rather than guessed from the image label.
      - name: Install the libraries headless Chrome links against
        run: |
          set -euo pipefail
          sudo apt-get update
          pkgs=""
          for p in libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                   libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                   libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
                   libasound2; do
            if apt-cache show "${p}t64" >/dev/null 2>&1; then
              pkgs="${pkgs} ${p}t64"
            else
              pkgs="${pkgs} ${p}"
            fi
          done
          echo "installing:${pkgs}"
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${pkgs}

      # `npm ci` rather than `npm install`: the lockfile is tracked so the
      # browser build under test is the same one a contributor rendered against.
      - name: npm ci
        run: npm ci

      - name: Render every screen
        run: npm run screens

      # Kept on failure too — when an assertion trips, the picture of the screen
      # that tripped it is the fastest way to see why.
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens-out/
          if-no-files-found: error
