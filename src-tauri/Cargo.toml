[package]
name = "selfsame"
description = "Selfsame — the root-key custodian. Creates an identity, authorises a device, and revokes one that is gone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "selfsame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selfsame-core = { workspace = true }
# IMPL-004 CON-601/603 — the SPEC-004 pure core. No network crate enters here.
selfsame-app-identity = { workspace = true }
selfsame-app-identity-net = { path = "../crates/selfsame-app-identity-net" }
did-crdt = { workspace = true }

tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

ed25519-dalek = { workspace = true, features = ["std"] }
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
zeroize = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { workspace = true }

# ── mobile ──────────────────────────────────────────────────────────────────
#
# Selfsame is a phone application (ADR-002). The camera and the biometric
# presence check are mobile-only Tauri plugins; on desktop the typed code of
# REQ-011 and the device passcode of REQ-024 take their place, both of which
# the specification makes first-class rather than fallbacks.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"

# `keyring` (above) has no Android backend — its `cfg` cascade falls through to
# an in-memory testing mock, so the published APK accepted every write to the
# root record and kept none. This plugin is the Android half of REQ-024:
# `AndroidKeyStore`, TEE- or StrongBox-wrapped. Android only; iOS is served by
# `keyring`'s `apple-native` feature, which is a real Keychain backend.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-selfsame-store = { path = "../crates/tauri-plugin-selfsame-store" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
blake3 = { workspace = true, features = ["std"] }
