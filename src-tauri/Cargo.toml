[package]
name = "selfsame"
description = "Selfsame — the root-key custodian. Creates an identity, authorises a device, and revokes one that is gone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "selfsame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
local-pairing-demo = ["selfsame-pairing/local-pairing-demo"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selfsame-core = { workspace = true }
# IMPL-004 CON-601/603 — the SPEC-004 pure core. No network crate enters here.
selfsame-app-identity = { workspace = true }
selfsame-app-identity-net = { path = "../crates/selfsame-app-identity-net" }
selfsame-pairing = { path = "../crates/selfsame-pairing" }
cbcl-pairing = { workspace = true }
# CON-409 record envelopes travel as base64url.
base64ct = { workspace = true }
did-crdt = { workspace = true }

tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

ed25519-dalek = { workspace = true, features = ["std"] }
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
zeroize = { version = "1", features = ["alloc"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { workspace = true }
# SPEC-008 ADR-901/ADR-911: the claimant speaks wss:// through rustls with
# bundled webpki roots — identical certificate behaviour on Android and
# desktop, and no plaintext or invalid-certificate fallback (NFR-901).
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

# ── mobile ──────────────────────────────────────────────────────────────────
#
# Selfsame is a phone application (ADR-002). The camera and the biometric
# presence check are mobile-only Tauri plugins; on desktop the typed code of
# REQ-011 and the device passcode of REQ-024 take their place, both of which
# the specification makes first-class rather than fallbacks.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"

# `keyring` (above) has no Android backend — its `cfg` cascade falls through to
# an in-memory testing mock, so the published APK accepted every write to the
# root record and kept none. This plugin is the Android half of REQ-024:
# `AndroidKeyStore`, TEE- or StrongBox-wrapped. Android only; iOS is served by
# `keyring`'s `apple-native` feature, which is a real Keychain backend.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-selfsame-store = { path = "../crates/tauri-plugin-selfsame-store" }

# Suspend-inclusive CLOCK_BOOTTIME uses the platform ABI from the existing lock pin.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Reuse the existing canonical codec for typed comparison fixture substitutions.
ciborium = "=0.2.2"
cbor2 = "=1.1.0"
# SPEC-077 TEST-008: feature unification applies only to native test builds.
selfsame-app-identity-net = { path = "../crates/selfsame-app-identity-net", features = ["native-test-support"] }
tauri = { version = "2", features = ["test"] }
zeroize = { version = "1", features = ["serde"] }
# TEST-901/TEST-902's loopback TLS relay: a self-signed root minted per test
# run, injected only through the test-only connector constructor.
rcgen = "0.13"
# The SPEC-004 fixture module (shared by #[path] like local_demo's) mints
# mnemonics; only tests compile it.
bip39 = { version = "2", default-features = false, features = ["std"] }
axum = "0.7"
base64ct = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
ed25519-dalek = { workspace = true, features = ["std"] }
blake3 = { workspace = true, features = ["std"] }
