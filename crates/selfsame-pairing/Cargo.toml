[package]
name = "selfsame-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Selfsame credential composition for cbcl-pairing"

[dependencies]
base64ct = { workspace = true }
cbcl-pairing = { workspace = true }
cbcl-pairing-core = { package = "cbcl-core", version = "=0.1.0", git = "https://codeberg.org/anuna/cbcl-rs", rev = "febc6691e6dd2d5f7116b1a4d84c984b64717564" }
ciborium = "=0.2.2"
selfsame-app-identity = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
axum = "0.7"
bip39 = "2"
ed25519-dalek = { workspace = true }
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
