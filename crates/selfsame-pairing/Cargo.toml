[package]
name = "selfsame-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Selfsame credential composition for cbcl-pairing"

[features]
default = []
local-pairing-demo = ["dep:bip39"]

[dependencies]
base64ct = { workspace = true }
cbcl-pairing = { workspace = true }
cbcl-pairing-core = { package = "cbcl-core", version = "=0.1.0", git = "https://git.anuna.io/anuna-research/cbcl-rs", rev = "58dbcfcfb286a97a9e1ea076c19d401bf15be918" }
ciborium = "=0.2.2"
cbor2 = "=1.1.0"
did-crdt = { workspace = true }
selfsame-app-identity = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
bip39 = { version = "2", optional = true }
ed25519-dalek = { workspace = true, features = ["std"] }
sha2 = { version = "0.11", default-features = false }

# The browser allocator's local fixture inputs come from the same
# `local_demo::credential` the wallet rebuilds; the example only serialises.
[[example]]
name = "local-pairing-fixture"
required-features = ["local-pairing-demo"]

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
bip39 = "2"
ed25519-dalek = { workspace = true }
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
