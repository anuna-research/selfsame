[package]
name = "selfsame-beam"
description = "Selfsame Path-B Rustler binding for BEAM applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cbcl_selfsame_erl"
crate-type = ["cdylib", "rlib"]

[dependencies]
selfsame-app-identity.workspace = true
selfsame-pairing = { path = "../selfsame-pairing" }
cbcl-pairing.workspace = true
did-crdt.workspace = true
ed25519-dalek = { workspace = true, features = ["std", "zeroize"] }
rustler = { version = "0.36", default-features = false, features = ["nif_version_2_15"] }
serde_json.workspace = true

[dev-dependencies]
bip39 = { version = "2", default-features = false, features = ["std"] }
